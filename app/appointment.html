<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento</title>
    <link rel="stylesheet" href="/app-style/appointment.css">
    <link rel="stylesheet" href="/app-style/default.css">
</head>

<body>
    <section class="container-appointment">

        <article class="appointment__date-select">

            <article class="calendar">
                <h1>Agende seu serviço</h1>
            </article>

            <h2 class="appointment__date-select-title">Agosto, 2026</h2>

            <ul class="appointment__week">
                <li>Seg</li>
                <li>Ter</li>
                <li>Qua</li>
                <li>Qui</li>
                <li id="selected-week">Sex</li>
                <li>Sáb</li>
                <li>Dom</li>
            </ul>


            <ul class="appointment__days">
                <li>12</li>
                <li>13</li>
                <li>14</li>
                <li>15</li>
                <li id="seleceted-day">16</li>
                <li>17</li>
                <li>18</li>
            </ul>

        </article>

        <section class="appointment__hours-select">
            <h2>
                Selecione um horário
            </h2>

            <article class="hours-select">
                <div class="hours">
                    8:00
                </div>
                <div class="hours">
                    9:00
                </div>
                <div class="hours">
                    10:00
                </div>
                <div class="hours">
                    11:00
                </div>
                <div class="hours">
                    12:00
                </div>
                <div class="hours">
                    14:00
                </div>
                <div class="hours">
                    15:00
                </div>
                <div class="hours">
                    16:00
                </div>
                <div class="hours">
                    17:00
                </div>
                <div class="hours">
                    18:00
                </div>
            </article>
        </section>

        <section class="appointment__profissional">

            <h2>Escolha seu atendente</h2>

            <article class="appointment__profissional-select">
                <div class="appointment__profissional-perfil">
                    <label for="select-perfil-1" name="joel">Joel
                        <input type="checkbox" id="select-perfil-1">
                    </label>
                    <label for="select-perfil-2">Pedro
                        <input type="checkbox" id="select-perfil-2">
                    </label>
                    <label for="select-perfil-3">Joel
                        <input type="checkbox" id="select-perfil-3">
                    </label>
                </div>
            </article>
        </section>

        <button class="appointment__btn-proceed">Continuar</button>
    </section>
</body>

</html>
