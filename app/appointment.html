<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento</title>
    <link rel="stylesheet" href="../app-style/appointment.css">
    <link rel="stylesheet" href="../app-style/default.css">
</head>

<body>
    <section class="container-appointment">

        <article class="appointment__date-select">

            <article class="calendar">
                <h1>Agende seu serviço</h1>
            </article>

            <h2 class="appointment__date-select-title">Agosto, 2026</h2>

            <ul class="dias-semana">
                <li>
                    <span class="week">Seg</span>
                    <span class="date">10</span>
                </li>
                <li>
                    <span class="week">Ter</span>
                    <span class="date">11</span>
                </li>
                <li>
                    <span class="week">Qua</span>
                    <span class="date">12</span>
                </li>
                <li>
                    <span class="week">Qui</span>
                    <span class="date">13</span>
                </li>
                <li>
                    <span class="week">Sex</span>
                    <span class="date">14</span>
                </li>
                <li>
                    <span class="week">Sáb</span>
                    <span class="date">15</span>
                </li>
                <li>
                    <span class="week">Dom</span>
                    <span class="date">16</span>
                </li>
            </ul>

        </article>

        <section class="appointment__hours-select">
            <h2>
                Selecione um horário
            </h2>

            <article class="hours-select">
                <div class="hours">
                    8:00
                </div>
                <div class="hours">
                    9:00
                </div>
                <div class="hours">
                    10:00
                </div>
                <div class="hours">
                    11:00
                </div>
                <div class="hours">
                    12:00
                </div>
                <div class="hours">
                    14:00
                </div>
                <div class="hours">
                    15:00
                </div>
                <div class="hours">
                    16:00
                </div>
                <div class="hours">
                    17:00
                </div>
                <div class="hours">
                    18:00
                </div>
            </article>
        </section>

        <section class="appointment__profissional">

            <h2>Escolha seu atendente</h2>

            <article class="appointment__profissional-select">
                    <label for="profissional-1" class="container-input">
                        <input type="radio" name="input-profissional" id="profissional-1" value="joao">
                        <span>João</span>
                    </label>
                    <label for="profissional-2" class="container-input">
                        <input type="radio" name="input-profissional" id="profissional-2" value="pedro">
                        <span>Pedro</span>
                    </label>
                    <label for="profissional-3" class="container-input">
                        <input type="radio" name="input-profissional" id="profissional-3" value="marcos">
                        <span>Marcos</span>
                    </label>


            </article>
        </section>

        <button class="appointment__btn-proceed">Continuar</button>
    </section>
    <script src="../scripts/appoiment.js"></script>
</body>

</html>
